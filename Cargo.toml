[package]
name = "clash-verge-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "A terminal control surface for Clash Verge Rev and Mihomo"

[dependencies]
anyhow = "1.0"
bytes = "1.10"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6.0"
http-body-util = "0.1"
hyper = { version = "1.7", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.47", features = ["macros", "net", "process", "rt-multi-thread", "signal", "time"] }
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true
